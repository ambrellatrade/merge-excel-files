[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprut-importer"
version = "0.1.0"
description = "Importer builder for SprutTP from hierarchical Excel specifications"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
  "xlrd==2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["sprut_importer"]
